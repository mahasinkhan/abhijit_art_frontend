<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Search ────────────────────────────────────────────────────────
         The description is what Google prints under the blue link, so it
         leads with the services people actually search for, then the town.
         Without it Google scrapes whatever text it finds first, which on a
         React shell is often nothing at all. -->
    <title>Abhijit Art — Printing &amp; Design Studio in Berhampore, Murshidabad</title>
    <meta
      name="description"
      content="Flex printing, LED &amp; signage boards, laser cutting, stickers, visiting cards, stamps and PVC cards in Berhampore, Murshidabad. Designed and delivered since 2000."
    />
    <link rel="canonical" href="https://www.abhijitart.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#d9542f" />

    <!-- ── Link previews (WhatsApp, Facebook, LinkedIn) ────────────────
         Without these a shared link shows as bare text. og:image must be an
         absolute https URL — relative paths are ignored by every scraper. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Abhijit Art" />
    <meta property="og:title" content="Abhijit Art — Printing &amp; Design Studio in Berhampore" />
    <meta
      property="og:description"
      content="Flex printing, signage, laser cutting, stickers and visiting cards in Berhampore, Murshidabad."
    />
    <meta property="og:url" content="https://www.abhijitart.com/" />
    <meta property="og:image" content="https://www.abhijitart.com/images/abhijit_art_hero.png" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Abhijit Art — Printing &amp; Design Studio in Berhampore" />
    <meta
      name="twitter:description"
      content="Flex printing, signage, laser cutting, stickers and visiting cards in Berhampore, Murshidabad."
    />
    <meta name="twitter:image" content="https://www.abhijitart.com/images/abhijit_art_hero.png" />

    <!-- ── Icons ─────────────────────────────────────────────────────── -->
    <link rel="icon" type="image/png" href="/images/abhijit_art_logo.png" />
    <link rel="apple-touch-icon" href="/images/abhijit_art_logo.png" />

    <!-- ── Local business schema ──────────────────────────────────────
         This is what feeds the Google side panel: name, address, phone,
         hours, coordinates. Getting it right here also gives Google a
         second, consistent source when the Business Profile disagrees. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "@id": "https://www.abhijitart.com/#business",
        "name": "Abhijit Art",
        "description": "Printing and design studio offering flex printing, signage and LED boards, laser cutting, sticker cutting, stamps, PVC cards and visiting cards.",
        "url": "https://www.abhijitart.com/",
        "logo": "https://www.abhijitart.com/images/abhijit_art_logo.png",
        "image": "https://www.abhijitart.com/images/abhijit_art_hero.png",
        "telephone": "+917405179066",
        "email": "abhijitart85@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Rabindra Sadan, Shakti Mandir Club, SS Sen Road",
          "addressLocality": "Berhampore",
          "addressRegion": "West Bengal",
          "postalCode": "742101",
          "addressCountry": "IN"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 24.090785,
          "longitude": 88.251619
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
            "opens": "10:00",
            "closes": "20:00"
          }
        ],
        "priceRange": "₹₹",
        "areaServed": { "@type": "City", "name": "Berhampore" }
      }
    </script>

    <!-- Premium fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      /* ✅ Cream background — overrides nothing in styles.css */
      html, body, #root {
        margin: 0;
        padding: 0;
        background: #f7f3ea;   /* warm ivory — was #0f1115 (dark) */
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>Abhijit Art — Printing &amp; Design Studio, Berhampore</h1>
      <p>
        Flex printing, LED and signage boards, laser cutting, sticker cutting, stamps,
        PVC cards and visiting cards in Berhampore, Murshidabad, West Bengal.
        Call <a href="tel:+917405179066">+91 74051 79066</a> or email
        <a href="mailto:abhijitart85@gmail.com">abhijitart85@gmail.com</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
